name: Go

on:
  # Automatic runs on push / pull_request are disabled; run manually from the
  # Actions tab (workflow_dispatch) when needed.
  workflow_dispatch:

env:
  # Use exactly the installed toolchain (matches go.mod's `go 1.25`); never let
  # GOTOOLCHAIN=auto silently download a different, unpinned toolchain.
  GOTOOLCHAIN: local

jobs:

  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Set up DynamoDB Local
      uses: rrainn/dynamodb-action@v4.0.0
      with:
        port: 8000
        cors: '*'

    - name: Test
      run: go test -v -count=1 ./...

    - name: Test (race detector)
      run: go test -race -count=1 ./...
